    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Имя Фамилия" />
    <meta property="og:title" content="Имя Фамилия — Портфолио" />
    <meta property="og:description" content="Личный сайт-резюме — обо мне, опыт, навыки и проекты." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Имя Фамилия — Портфолио" />
    <meta name="twitter:description" content="Личный сайт-резюме — обо мне, опыт, навыки и проекты." />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Имя Фамилия",
        "url": "https://cv.perricheno.com/",
        "jobTitle": "Должность / специализация",
        "sameAs": [
          "https://github.com/username",
          "https://linkedin.com/in/username",
          "https://t.me/username"
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Имя Фамилия — Портфолио</title>
    <script>
      try {
        var t = localStorage.getItem('cv-theme')
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t
        } else if (matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.dataset.theme = 'dark'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
